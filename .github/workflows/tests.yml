name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor fastapi/uvicorn require, and the current release.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # The suite runs entirely on synthetic fixtures: no API key, no quota and
      # no network are needed, so it can gate every push without secrets.
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      # Real errors only (syntax, undefined names) - not style opinions.
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
